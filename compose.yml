name: affine-bas

services:
  affine:
    image: ${AFFINE_IMAGE:-ghcr.io/toeverything/affine:stable}
    container_name: affine_bas_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      affine_migration:
        condition: service_completed_successfully
    volumes:
      - ./data/storage:/root/.affine/storage
      - ./config:/root/.affine/config
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: postgresql://affine@postgres:5432/affine
      AFFINE_INDEXER_ENABLED: "false"
    networks:
      default:
        aliases:
          - affine-upstream

  affine_migration:
    image: ${AFFINE_IMAGE:-ghcr.io/toeverything/affine:stable}
    container_name: affine_bas_migration
    volumes:
      - ./data/storage:/root/.affine/storage
      - ./config:/root/.affine/config
    command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: postgresql://affine@postgres:5432/affine
      AFFINE_INDEXER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: affine_bas_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: affine_bas_postgres
    restart: unless-stopped
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: affine
      POSTGRES_DB: affine
      POSTGRES_INITDB_ARGS: "--data-checksums"
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "affine", "-d", "affine"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: ghcr.io/tailscale/caddy-tailscale:main
    container_name: affine_bas_caddy
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY must be set in .env}
      TS_FQDN: ${TS_FQDN:?TS_FQDN must be set in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_ts_state:/config
      - caddy_data:/data

volumes:
  caddy_ts_state:
  caddy_data:
